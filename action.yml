name: Checkout Git LFS
description: >-
  Check out a repository and pull Git LFS objects from the server configured
  in its .lfsconfig, authenticating with a token if provided, a GitHub OIDC
  token when available, or anonymously for public repos.

branding:
  icon: download-cloud
  color: orange

inputs:
  lfs-pat:
    description: >-
      Credential for the LFS server, sent as the basic-auth password: a GitHub
      personal access token or a self-issued token minted by the server
      operator. When empty, falls back to minting a GitHub OIDC token with the
      LFS host as audience (requires `id-token: write` permission on the
      calling job), and failing that to an anonymous pull, which the server
      allows for public repos only.
    required: false
    default: ''
  lfs-host:
    description: >-
      Expected LFS server hostname, e.g. "lfs.example.com". Required when
      `lfs-pat` is set: the transfer host is read from the checked-out
      .lfsconfig, which on an untrusted ref could be tampered with to redirect
      the credential — pinning the hostname here refuses the mismatch. Optional
      with OIDC, whose tokens are audience-bound to the host they were minted
      for and useless elsewhere.
    required: false
    default: ''
  repository:
    description: Repository to check out, owner/name. Defaults to the repository running the workflow.
    required: false
    default: ''
  ref:
    description: Branch, tag, or SHA to check out. Defaults to the triggering ref, or the default branch when `repository` is another repo.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Deliberately not using `lfs: true`: checkout fetches LFS objects before
    # the working tree exists, so .lfsconfig (which points at the custom LFS
    # server) is never read and the fetch 404s against github.com's endpoint.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository || github.repository }}
        ref: ${{ inputs.ref }}
        persist-credentials: false

    # The LFS host is derived from .lfsconfig. The credential helper
    # references $LFS_TOKEN rather than embedding the token, and is passed
    # per-invocation via `git -c`, so the token never lands in .git/config and
    # is gone when this step ends.
    - name: Pull LFS objects
      shell: bash
      env:
        LFS_TOKEN: ${{ inputs.lfs-pat }}
        EXPECTED_LFS_HOST: ${{ inputs.lfs-host }}
      run: |
        set -euo pipefail
        if [[ ! -f .lfsconfig ]]; then
          echo "::error::.lfsconfig not found in the repository root — this action only supports repos with a custom LFS server; use actions/checkout with \`lfs: true\` for github.com-hosted LFS"
          exit 1
        fi
        if ! LFS_URL=$(git config --file .lfsconfig lfs.url); then
          echo "::error::.lfsconfig has no lfs.url value — expected \"url = https://<lfs-host>/<path>\" in an [lfs] section"
          exit 1
        fi
        if [[ "$LFS_URL" != https://* ]]; then
          echo "::error::lfs.url in .lfsconfig must be an https:// URL, got \"$LFS_URL\""
          exit 1
        fi
        LFS_HOST=${LFS_URL#*://}
        LFS_HOST=${LFS_HOST%%/*}
        LFS_HOST=$(printf '%s' "$LFS_HOST" | tr '[:upper:]' '[:lower:]')
        # The host above comes from repository content, so a credential must
        # only be sent to a host the workflow itself pinned via lfs-host
        EXPECTED_HOST=${EXPECTED_LFS_HOST#https://}
        EXPECTED_HOST=${EXPECTED_HOST%%/*}
        EXPECTED_HOST=$(printf '%s' "$EXPECTED_HOST" | tr '[:upper:]' '[:lower:]')
        if [[ -n "$LFS_TOKEN" && -z "$EXPECTED_HOST" ]]; then
          echo "::error::lfs-host is required when lfs-pat is set — it pins the host the credential may be sent to, so a tampered .lfsconfig can't redirect it"
          exit 1
        fi
        if [[ -n "$EXPECTED_HOST" && "$LFS_HOST" != "$EXPECTED_HOST" ]]; then
          echo "::error::.lfsconfig points at \"$LFS_HOST\" but the workflow pins lfs-host to \"$EXPECTED_HOST\" — refusing to authenticate against an unexpected host"
          exit 1
        fi
        if [[ -n "$LFS_TOKEN" ]]; then
          echo "Authenticating to $LFS_HOST with the lfs-pat token"
          LFS_USER=pat
        elif [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "lfs-pat input not set, authenticating to $LFS_HOST with OIDC"
          LFS_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$LFS_HOST" | jq -r .value)
          echo "::add-mask::$LFS_TOKEN"
          LFS_USER=oidc
        else
          # The server allows anonymous downloads from public repos, so a
          # missing credential is a notice rather than an error — this keeps
          # fork PRs, which can never obtain an OIDC token, working
          echo "::notice::No lfs-pat set and no OIDC token available — pulling from $LFS_HOST anonymously, which the server allows for public repos only. For private repos, grant \`id-token: write\` on this job or set \`lfs-pat\`."
          GIT_TERMINAL_PROMPT=0 git lfs pull
          exit 0
        fi
        export LFS_TOKEN
        git -c "credential.https://$LFS_HOST.helper=!f() { echo username=$LFS_USER; echo password=\$LFS_TOKEN; };f" \
          lfs pull
